<title>WKN Group Data Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sidebar + sticky topbar + content, footer di bawah. Abu muda/putih, aksen biru WKN (placeholder sampai logo diterima). */
:root{
  --wkn:#1414e0; --wkn-d:#0d0db0; --wkn-soft:#e9e9ff; --wkn-or:#ff9900; --acc-soft:#fff2d4; --acc-ink:#9a5b00; --wkn-ink:#ffffff; --logo-fx:none;
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --line:#dde3ec; --line-2:#e9edf3;
  --fg:#18212f; --fg-2:#4b586b; --fg-3:#7a8697;
  --ok:#17803d; --ok-bg:#e3f4ea; --warn:#9a6500; --warn-bg:#fdf1d6; --bad:#b42318; --bad-bg:#fde6e3; --mute-bg:#eceff4;
  --shadow:0 1px 2px rgba(20,33,56,.05),0 4px 14px rgba(20,33,56,.06);
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --f-head:'Space Grotesk','Inter',system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wkn:#8490ff; --wkn-d:#aab3ff; --wkn-soft:#1b1f4a; --wkn-or:#ffb020; --acc-soft:#3a2e10; --acc-ink:#ffb020; --wkn-ink:#0b1220; --logo-fx:drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px rgba(255,255,255,.85));
  --bg:#0e1420; --surface:#151c2b; --surface-2:#1a2335; --line:#27324a; --line-2:#202b41;
  --fg:#e8edf6; --fg-2:#aab5c8; --fg-3:#7f8ba0;
  --ok:#5fd18a; --ok-bg:#12301f; --warn:#f0bf55; --warn-bg:#3a2e10; --bad:#ff8a7d; --bad-bg:#401a17; --mute-bg:#212b40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --wkn:#8490ff; --wkn-d:#aab3ff; --wkn-soft:#1b1f4a; --wkn-or:#ffb020; --acc-soft:#3a2e10; --acc-ink:#ffb020; --wkn-ink:#0b1220; --logo-fx:drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px rgba(255,255,255,.85));
  --bg:#0e1420; --surface:#151c2b; --surface-2:#1a2335; --line:#27324a; --line-2:#202b41;
  --fg:#e8edf6; --fg-2:#aab5c8; --fg-3:#7f8ba0;
  --ok:#5fd18a; --ok-bg:#12301f; --warn:#f0bf55; --warn-bg:#3a2e10; --bad:#ff8a7d; --bad-bg:#401a17; --mute-bg:#212b40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:var(--f-head);margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wkn);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)} .sm{font-size:12.5px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Shell */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0 20px;max-width:1500px;margin:0 auto;min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;padding:16px 0;gap:6px}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px 14px}
.brand .t{font:700 15px/1.15 var(--f-head)} .brand .s{font-size:11.5px;color:var(--fg-3)}
.logo{flex:none;display:grid;place-items:center}.lg{display:block;width:64px;height:auto;filter:var(--logo-fx)}
.logochip{align-self:flex-start;width:fit-content;max-width:100%}.logochip img{display:block;width:260px;max-width:100%;height:auto;filter:var(--logo-fx)}
.nav{overflow:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px;flex:1;min-height:0}
.nav h4{margin:14px 10px 4px;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--fg-2);text-decoration:none;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface);color:var(--fg)}
.nav a.on{background:var(--wkn);color:var(--wkn-ink)}
.nav .bd{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;border-radius:99px;padding:0 7px;line-height:18px;font-weight:600}
.me{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.av{width:36px;height:36px;border-radius:50%;background:var(--wkn-soft);color:var(--wkn);display:grid;place-items:center;font-weight:700;flex:none;font-size:13px}
.me .n{font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .me .r{font-size:12px;color:var(--fg-3)}
.me > div:nth-child(2){min-width:0;flex:1}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px 12px;padding:14px 0 12px;flex-wrap:wrap;min-height:72px}
.top .burger{order:0}.top h1{order:1}.top .ctl{order:2}.top .themebtn{order:3}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top h1{font-size:22px;margin-right:auto;min-width:0;flex:1 1 auto}
.top .crumb{font-size:12px;color:var(--fg-3);display:block;font-family:var(--f-body);font-weight:500;letter-spacing:0}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 30px 7px 11px;min-height:38px;max-width:100%}
.burger{display:none}
.top{position:sticky}.top::after{content:'';position:absolute;left:0;bottom:0;width:96px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--wkn) 0 64px,var(--wkn-or) 64px 100%)}
.nav a.on{box-shadow:inset 4px 0 0 var(--wkn-or)}
.ic.y{background:var(--acc-soft)!important;color:var(--acc-ink)!important}
.mark{background:linear-gradient(transparent 62%,var(--wkn-or) 62% 90%,transparent 90%);color:inherit;padding:0 2px}
.lbox h2.ttl::after{content:'';display:block;width:44px;height:3px;border-radius:3px;margin-top:8px;background:linear-gradient(90deg,var(--wkn) 0 28px,var(--wkn-or) 28px)}
.foot{border-top:1px solid var(--line);position:relative}.foot::before{content:'';position:absolute;left:50%;top:-2px;width:72px;height:3px;margin-left:-36px;border-radius:3px;background:linear-gradient(90deg,var(--wkn) 0 48px,var(--wkn-or) 48px)}
:focus-visible{outline-color:var(--wkn-or)}
.content{flex:1;display:flex;flex-direction:column;gap:18px;padding-bottom:24px}
.foot{padding:16px 0 22px;border-top:1px solid var(--line);color:var(--fg-3);font-size:12.5px;text-align:center}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;min-height:38px;font-weight:600;color:var(--fg);transition:transform .1s,background .15s,border-color .15s}
.btn:hover{border-color:var(--wkn);color:var(--wkn)} .btn:active{transform:translateY(1px)}
.btn.pri{background:var(--wkn);border-color:var(--wkn);color:var(--wkn-ink)} .btn.pri:hover{background:var(--wkn-d);color:var(--wkn-ink)}
.btn.bad{color:var(--bad)} .btn.bad:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:12.5px} .btn[disabled]{opacity:.45;pointer-events:none}
.btn.ico{padding:0;width:38px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0} .field label{font-weight:600;font-size:12.5px;color:var(--fg-2)}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-height:40px}
.in:focus{border-color:var(--wkn);outline:2px solid var(--wkn-soft)}
textarea.in{min-height:70px;resize:vertical}
.pw{position:relative} .pw .in{padding-right:44px}
.pw button{position:absolute;right:4px;top:4px;width:34px;height:32px;border:0;background:none;color:var(--fg-3);border-radius:7px;display:grid;place-items:center}
.pw button:hover{color:var(--wkn);background:var(--wkn-soft)}
.hint{font-size:12px;color:var(--fg-3)} .err{color:var(--bad);font-size:12.5px;min-height:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card .hd{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;min-height:60px}
.card .hd h2{font-size:15.5px} .card .bd{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12.5px;color:var(--fg-2);display:flex;gap:8px;align-items:center} .kpi .v{font:700 28px/1.2 var(--f-head)} .kpi .d{font-size:12px;color:var(--fg-3)}
.kpi .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--wkn-soft);color:var(--wkn)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mute{background:var(--mute-bg);color:var(--fg-2)} .pill.blue{background:var(--wkn-soft);color:var(--wkn)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:180px;max-width:360px} .search svg{position:absolute;left:11px;top:11px;color:var(--fg-3)} .search .in{padding-left:36px}
.tw{overflow-x:auto;max-width:100%;background-color:var(--surface);background-repeat:no-repeat;background-size:44px 100%,44px 100%,16px 100%,16px 100%;background-attachment:local,local,scroll,scroll;
  background-image:linear-gradient(to right,var(--surface) 30%,transparent),linear-gradient(to left,var(--surface) 30%,transparent),radial-gradient(farthest-side at 0 50%,rgba(15,25,45,.3),transparent),radial-gradient(farthest-side at 100% 50%,rgba(15,25,45,.3),transparent);
  background-position:left center,right center,left center,right center}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal;min-width:190px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3);font-weight:600;white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
th.s{cursor:pointer;user-select:none} th.s:hover{color:var(--wkn)}
td.r,th.r{text-align:right} tbody tr:hover td{background:var(--surface-2)} tr.click{cursor:pointer}
td.in-c{color:var(--ok);font-weight:600} td.out-c{color:var(--bad);font-weight:600}
.bar{height:7px;background:var(--mute-bg);border-radius:9px;overflow:hidden;min-width:70px} .bar i{display:block;height:100%;background:var(--wkn);border-radius:9px;transition:width .5s}
.bar.hi i{background:var(--warn)} .bar.vh i{background:var(--bad)}
.delta{font-weight:600;font-size:12.5px;white-space:nowrap} .delta.up{color:var(--bad)} .delta.dn{color:var(--ok)} .delta.na{color:var(--fg-3)}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.col{display:flex;flex-direction:column}.grow{flex:1}.attn{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.hb{gap:16px}.hr{display:grid;gap:6px}.hrt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.hrt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}.hr .bar{height:9px}.bar.mk{position:relative}.bar.mk::after{content:'';position:absolute;left:75%;top:-2px;bottom:-2px;width:1.5px;background:var(--fg-3);opacity:.55}
.roles2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.hb{display:grid;gap:11px} .hb .row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 52px;gap:10px;align-items:center;font-size:13px} .hb .row b{text-align:right;font-weight:600}
.tabs{display:flex;gap:4px;background:var(--mute-bg);padding:4px;border-radius:10px;width:max-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--fg-2)} .tabs button.on{background:var(--surface);color:var(--wkn);box-shadow:var(--shadow),inset 0 -3px 0 var(--wkn-or)}
.empty{padding:34px 16px;text-align:center;color:var(--fg-3)}
.list{display:grid;gap:10px}
.li{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;flex-wrap:wrap}
.li .g{flex:1;min-width:160px}
.matrix{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--wkn);width:16px;height:16px}
.chk.dis{opacity:.55;cursor:not-allowed}
.rolerow{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);width:100%;text-align:left}
.rolerow.on{border-color:var(--wkn);background:var(--wkn-soft)}
.lvl{min-width:34px;text-align:center;font:700 12px var(--f-head);background:var(--mute-bg);border-radius:6px;padding:2px 7px;color:var(--fg-2)}
.stack{display:flex;flex-direction:column;gap:10px}

/* Overlays */
.ov{position:fixed;inset:0;background:rgba(10,16,28,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:14px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .18s}
.modal.wide{width:min(860px,100%)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mb{padding:18px;display:flex;flex-direction:column;gap:14px} .modal .mf{padding:14px 18px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:50;box-shadow:-10px 0 40px rgba(0,0,0,.25);overflow:auto;animation:slide .2s;padding-top:env(safe-area-inset-top,0px)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:70;max-width:calc(100% - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);animation:pop .2s;font-weight:500}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}} @keyframes slide{from{transform:translateX(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0 24px;max-width:1200px;margin:0 auto;align-items:center}
.hero{padding:30px 10px;display:flex;flex-direction:column;gap:22px}
.hero h1{font-size:clamp(28px,4vw,42px);line-height:1.1} .hero p{color:var(--fg-2);max-width:46ch;margin:0}
.feat{display:grid;gap:10px;max-width:460px}
.feat div{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.feat .ic{width:32px;height:32px;border-radius:8px;background:var(--wkn-soft);color:var(--wkn);display:grid;place-items:center}
.lbox{padding:26px;display:flex;flex-direction:column;gap:14px}
.sep{display:flex;align-items:center;gap:10px;color:var(--fg-3);font-size:12px} .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.demo{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--fg-2)} .chip:hover{border-color:var(--wkn);color:var(--wkn)}

/* PDF preview */
.paper{background:#fff;color:#111;border:1px solid #cfd6e2;padding:26px;font-size:11.5px;min-width:560px;box-shadow:var(--shadow)}
.paper .kop .lg{filter:none}.paper .kop{display:flex;gap:12px;align-items:center;border-bottom:3px solid #ff9900;box-shadow:0 3px 0 -0px #fff,0 6px 0 -3px #1414e0;padding-bottom:10px;margin-bottom:12px}
.paper table{min-width:0;font-size:10.5px} .paper th{background:#eef2f8;color:#334;position:static} .paper td,.paper th{border:1px solid #d5dbe6;padding:4px 6px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--fg-2);background:var(--surface-2)}
.drop:hover{border-color:var(--wkn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .pair,.roles2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(290px,86%);z-index:45;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) 14px 16px max(14px,env(safe-area-inset-left,0px));transform:translateX(-105%);transition:transform .2s,visibility .2s;visibility:hidden;border-right:1px solid var(--line)}
  .side.open{transform:none;visibility:visible;box-shadow:10px 0 40px rgba(0,0,0,.25)}
  .burger{display:inline-flex}
  .login{grid-template-columns:minmax(0,1fr);gap:0}.hero{padding-bottom:6px}
}
@media (max-width:900px){
  .top .themebtn{order:2}.top .ctl{order:3;flex:1 1 100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.top .ctl:empty{display:none}
  .top .ctl .sel{width:100%;min-width:0}
  .hero{align-items:flex-start;gap:14px;padding:22px 0 4px}.hero p,.feat{display:none}.hero h1{font-size:24px}.logochip img{width:170px}
  .lbox{padding:20px}
}
@media (max-width:640px){
  .grid2{grid-template-columns:minmax(0,1fr)} .kpis{gap:10px} .kpi .v{font-size:23px}
  .top h1{font-size:19px} .hb .row{grid-template-columns:100px 1fr 46px}
  .card .hd .tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.card .hd .tools .search,.card .hd .tools .sel,.card .hd .tools .btn.pri{grid-column:1/-1;max-width:none}
  .sel{padding:7px 24px 7px 10px;font-size:13.5px}
}
</style>

<div id="root"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ============ Util ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n).toLocaleString('id-ID',{maximumFractionDigits:2});
const DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'], MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

const monthEnd=ym=>{const[y,m]=ym.split('-').map(Number);const e=new Date(Date.UTC(y,m,0));const s=dstr(e);return s>TODAY?TODAY:s};
const prevYm=ym=>{let[y,m]=ym.split('-').map(Number);m--;if(m<1){m=12;y--}return `${y}-${String(m).padStart(2,'0')}`};
const daysIn=ym=>{const a=monthStart(ym),b=monthEnd(ym);return Math.round((P(b)-P(a))/864e5)+1};
function calc(pids,iid,ym){
  const s=monthStart(ym),e=monthEnd(ym);let open=0,inn=0,out=0,last=null;
  ledger.forEach(l=>{if(l.iid!==iid||!pids.includes(l.pid))return;
    if(l.date<s)open+=l.in-l.out;
    else if(l.date<=e){if(l.type==='awal')open+=l.in;else{inn+=l.in;out+=l.out}}
    if(l.type!=='awal'&&l.date<=e&&(!last||l.date>last))last=l.date});
  return{open,inn,out,rem:open+inn-out,last};
}
function summary(pids,ym){
  const ids=[...new Set(pitems.filter(x=>pids.includes(x.pid)&&x.open!==null).map(x=>x.iid))];
  return ids.map(iid=>{
    const c=item(iid),cur=calc(pids,iid,ym),pv=calc(pids,iid,prevYm(ym));
    const base=cur.open+cur.inn, pct=base>0?cur.out/base*100:0, avg=cur.out/daysIn(ym);
    const cover=avg>0?cur.rem/avg:null, min=pitems.filter(x=>pids.includes(x.pid)&&x.iid===iid).reduce((a,x)=>a+x.min,0);
    const idle=cur.last?Math.round((P(monthEnd(ym))-P(cur.last))/864e5):999;
    let st='ok',stl='Aman';
    if(cur.rem<=min){st='bad';stl='Kritis'}else if(cur.rem<=min*1.5){st='warn';stl='Menipis'}else if(idle>=14){st='mute';stl='Tidak bergerak'}
    const pAvg=pv.out/daysIn(prevYm(ym)),dOut=pAvg>0?(avg-pAvg)/pAvg*100:null, dIn=pv.inn>0?(cur.inn-pv.inn)/pv.inn*100:null;
    return{iid,name:c.name,unit:c.unit,cat:c.cat,...cur,pct,avg,cover,min,idle,st,stl,pOut:pv.out,pIn:pv.inn,dOut,dIn};
  });
}
const scopePids=()=>S.pid==='all'?myProjects().map(p=>p.id):[S.pid];
function balanceRows(pid,iid){ // saldo berjalan dihitung saat tampil
  const rows=ledger.filter(l=>l.pid===pid&&l.iid===iid).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  let b=0;return rows.map(l=>({...l,bal:(b+=l.in-l.out)}));
}
const dlt=(v,invert)=>v===null?'<span class="delta na">baru</span>':`<span class="delta ${v>0?(invert?'up':'dn'):'dn'}${v>0&&!invert?'':''}" style="${v>0?'color:var(--bad)':'color:var(--ok)'}">${v>0?'▲':'▼'} ${Math.abs(v).toFixed(0)}%</span>`;

document.addEventListener('click',e=>{const sd=$('#side');if(sd&&sd.classList.contains('open')&&!e.target.closest('#side')&&!e.target.closest('[data-act=menu]'))sd.classList.remove('open');const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){if(t.type==='checkbox')return;f(t,e)}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.act==='perm'){A.perm(t);return}
  if(t.id==='selP'){S.pid=t.value;render()}else if(t.id==='selM'){S.ym=t.value;render()}else if(t.id==='selI'){S.iFilter=t.value;render()}
  else if(t.id==='tp'){fillTx()}else if(t.id==='ti'){upTx()}
  else if(t.id==='bp'){S.pid=t.value;render()}
  else if(t.id==='impf'&&t.files[0]){S.imp={file:t.files[0].name,rows:sampleRows(S.pid)};render();toast('Mockup: isi file tidak dibaca, memakai data contoh.')}});

  else if(t.id==='aq'){S.audQ=t.value;$('#tbl').innerHTML=audTable()}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const n=f.dataset.form;
  if(n==='noop'){if(f.dataset.rev){const l=ledger.find(x=>x.id==f.dataset.rev);ledger.push({id:lid++,pid:l.pid,iid:l.iid,date:l.date,type:'koreksi',in:l.out,out:l.in,note:'Koreksi atas entri #'+l.id,by:S.me.id,at:fts(now()),ref:l.id});log('Koreksi transaksi',item(l.iid).name,`Entri #${l.id} dibatalkan`);closeModal();render();toast('Entri koreksi dibuat atas nama Anda.')}
    else if(f.dataset.del){const u=userOf(f.dataset.del);users.splice(users.indexOf(u),1);log('Hapus akun',u.un,'');closeModal();render();toast('Akun dihapus.')}return}
  forms[n]?.(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(S.me&&NAV.some(n=>n[0]===h)){S.route=h;S.q='';S.imp=null;closeDrawer();render()}});
